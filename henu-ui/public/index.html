<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= webpackConfig.name %></title>
    <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
    html, body, #app { height: 100%; margin: 0; padding: 0; font-family: 'Noto Sans SC', sans-serif; }

    #loader-wrapper {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999;
      background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    #loader {
      width: 80px; height: 80px; border-radius: 50%;
      border: 3px solid transparent; border-top-color: #818cf8;
      animation: spin 1.2s linear infinite;
    }
    #loader::before {
      content: ""; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
      border-radius: 50%; border: 3px solid transparent; border-top-color: #6366f1;
      animation: spin 2s linear infinite;
    }
    #loader::after {
      content: ""; position: absolute; top: 14px; left: 14px; right: 14px; bottom: 14px;
      border-radius: 50%; border: 3px solid transparent; border-top-color: #3b82f6;
      animation: spin 1.5s linear infinite reverse;
    }
    #loader { position: relative; }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .load_title {
      color: rgba(255,255,255,0.5); font-size: 15px; margin-top: 28px;
      letter-spacing: 3px; font-weight: 400;
    }
    .load_title span { font-size: 12px; opacity: 0.4; display: block; margin-top: 6px; }

    /* Fade out */
    .loaded #loader-wrapper {
      opacity: 0; visibility: hidden;
      transition: opacity 0.6s 0.3s, visibility 0s 0.9s;
    }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loader-wrapper">
        <div id="loader"></div>
        <div class="load_title">正在加载系统资源，请耐心等待</div>
      </div>
    </div>
  </body>
</html>
